<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bias Mirror</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 2rem;
      }
      form {
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }
      pre {
        margin-top: 1.5rem;
        padding: 1rem;
        background: #f5f5f5;
        border-radius: 6px;
        overflow: auto;
        max-height: 70vh;
      }
    </style>
  </head>
  <body>
    <h1>Bias Mirror</h1>
    <p>Upload an audio file to generate a full equity report.</p>
    <form id="upload-form">
      <input type="file" name="file" accept="audio/*" required />
      <label>
        <input type="checkbox" id="speaker-labels" checked />
        Speaker labels
      </label>
      <button type="submit">Generate report</button>
    </form>
    <pre id="output">Awaiting upload...</pre>

    <script>
      const form = document.getElementById('upload-form');
      const output = document.getElementById('output');
      const speakerLabels = document.getElementById('speaker-labels');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        output.textContent = 'Uploading...';

        const fileInput = form.querySelector('input[type="file"]');
        if (!fileInput.files.length) {
          output.textContent = 'Please choose a file.';
          return;
        }

        const formData = new FormData();
        formData.append('file', fileInput.files[0]);

        try {
          const response = await fetch(`/api/full-report?speaker_labels=${speakerLabels.checked}`, {
            method: 'POST',
            body: formData,
          });
          const text = await response.text();
          if (!response.ok) {
            output.textContent = `Error ${response.status}: ${text}`;
            return;
          }
          output.textContent = JSON.stringify(JSON.parse(text), null, 2);
        } catch (error) {
          output.textContent = `Request failed: ${error}`;
        }
      });
    </script>
  </body>
</html>
